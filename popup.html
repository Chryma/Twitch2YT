<!doctype html>
<meta charset="utf-8">
<style>
  :root { --bg: #15161c; --card: #1f2029; --line: #2c2e3a; --text: #e8e8f0; --dim: #8a8ca0; --a1: #9146ff; --a2: #ff0000; }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 14px; font: 13px "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header img { width: 28px; height: 28px; }
  header b { font-size: 14px; }
  header small { display: block; color: var(--dim); font-size: 11px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input { min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
  input:focus { border-color: var(--a1); }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: linear-gradient(90deg, var(--a1), var(--a2)); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  #swap { width: 100%; }
  #list { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; max-height: 220px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 10px; border-radius: 8px; background: rgba(145, 70, 255, .12); }
  .row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row a { color: #ff8080; text-decoration: none; }
  .row button { padding: 0 6px; background: none; color: var(--dim); font-weight: 400; }
  .row button:hover { color: var(--text); }
  .empty, footer { color: var(--dim); font-size: 12px; }
  footer { font-size: 11px; }
</style>
<header>
  <img src="icons/icon48.png" alt="">
  <div><b>Twitch to YouTube</b><small id="sub">Watch a Twitch streamer's YouTube live instead</small></div>
</header>
<div class="card" id="swapCard" hidden><button id="swap">Swap this stream</button></div>
<div class="card">
  <form id="add">
    <input id="tw" placeholder="Twitch channel, e.g. xqc" required>
    <input id="yt" placeholder="YouTube @handle or channel URL" required>
    <button>Save</button>
  </form>
  <div id="list"></div>
</div>
<footer>Click a channel to edit it. Shift+click the on-page button to change a channel too.</footer>
<script src="popup.js"></script>
